services:
  robot:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      target: dev
    image: trickfire-urc:latest
    container_name: trickfire-urc
    user: trickfire
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - type: bind
        source: ..
        target: /home/trickfire/trickfire-urc
    working_dir: /home/trickfire/trickfire-urc
    stdin_open: true
    tty: true

  # Jetson AGX Orin running JetPack 7.2 (L4T r39.2):
  # docker compose -f .devcontainer/docker-compose.yml run --build --rm prod
  # Camera device mounts depend on the camera model.
  prod:
    privileged: true
    profiles: [prod]
    platform: linux/arm64
    runtime: nvidia
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      target: prod
    image: trickfire-urc-prod:latest
    user: trickfire
    devices:
      - "/dev/bus/usb:/dev/bus/usb"
    device_cgroup_rules:
      - "c 189:* rmw"
    command: >
      bash -c "sudo chmod 666 /dev/bus/usb/001/004 && tmux new -d -s ublox_session "ros2 launch ublox_dgnss ublox_rover_hpposecef.launch.py""
    group_add:
      - "plugdev"
    environment:
      TZ: ${TZ:-UTC}
      NVIDIA_VISIBLE_DEVICES: all
    network_mode: host
    volumes:
      - type: bind
        source: ..
        target: /home/trickfire/trickfire-urc
    working_dir: /home/trickfire/trickfire-urc
    stdin_open: true
    tty: true
