services:
  dev:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      target: dev
    image: trickfire-urc:latest
    container_name: trickfire-urc
    user: trickfire
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - type: bind
        source: ..
        target: /home/trickfire/trickfire-urc
      - type: bind
        source: ${HOME}/.ssh
        target: /home/trickfire/.ssh
        read_only: true
        bind:
          create_host_path: true
    working_dir: /home/trickfire/trickfire-urc
    network_mode: host
    privileged: true
    security_opt:
      - seccomp:unconfined
    stdin_open: true
    tty: true

  # Jetson AGX Orin running JetPack 7.2 (L4T r39.2):
  # Camera device mounts depend on the camera model.
  rover:
    privileged: true
    profiles: rover
    platform: linux/arm64
    runtime: nvidia
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      target: prod
    image: trickfire-urc-prod:latest
    user: trickfire
    environment:
      TZ: ${TZ:-UTC}
      NVIDIA_VISIBLE_DEVICES: all
    devices:
      - "/dev/bus/usb:/dev/bus/usb"
      - "/dev/ttyACM0:/dev/ttyACM0"
    device_cgroup_rules:
      - "c 189:* rmw"
    group_add:
      - "plugdev"
    network_mode: host
    volumes:
      - type: bind
        source: ..
        target: /home/trickfire/trickfire-urc
      - /run/udev:/run/udev:ro
    working_dir: /home/trickfire/trickfire-urc
    stdin_open: true
    tty: true
