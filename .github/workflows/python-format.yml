name: Python Lint & Format Check

on:
  push:
    paths:
      - "**/*.py"
      - "pyproject.toml"
  pull_request:
    paths:
      - "**/*.py"
      - "pyproject.toml"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ruff
        run: pipx install ruff==0.15.14

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .
