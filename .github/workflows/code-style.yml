name: Code Style

on: [push, pull_request]

jobs:
    python:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install Ruff
              run: python -m pip install ruff==0.15.14

            - name: Run Ruff check
              run: ruff check .

            - name: Run Ruff format check
              run: ruff format --check .

    shell:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install shfmt
              uses: mfinelli/setup-shfmt@v4

            - name: Check shell formatting
              run: shfmt -i 4 -s -d scripts/ .devcontainer/

    cpp:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install clang-format
              run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang-format

            - name: Check formatting
              run: |
                  find . -type f \( \
                    -name "*.cpp" -o -name "*.cc" -o -name "*.cxx" -o \
                    -name "*.c" -o -name "*.h" -o -name "*.hpp" -o \
                    -name "*.hxx" \
                  \) -not -path "./.git/*" -not -path "*/build/*" -not -path "*/install/*" -print0 \
                    | xargs -0 --no-run-if-empty clang-format --dry-run --Werror
